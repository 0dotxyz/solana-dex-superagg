[package]
name = "solana-dex-superagg"
version = "2.0.0"
edition = "2021"
rust-version = "1.91"
description = "Best-price exact-in swaps across the Jupiter, Titan and DFlow aggregators on Solana"
license = "MIT"
repository = "https://github.com/0dotxyz/solana-dex-superagg"
readme = "README.md"
keywords = ["solana", "dex", "swap", "jupiter", "titan", "dflow", "aggregator"]
categories = ["cryptography::cryptocurrencies", "web-programming"]
authors = ["Abdul Rabbani"]

[lib]
name = "solana_dex_superagg"
path = "src/lib.rs"

[dependencies]
solana-pubkey = "4"
solana-keypair = "=3.1.2"
solana-signer = "3"
solana-signature = "3"
solana-instruction = "3"
solana-message = "4"
solana-transaction = "4"
solana-client = "=4.2.2"
solana-commitment-config = "3.1.1"
solana-address-lookup-table-interface = { version = "3", features = ["bytemuck"] }
solana-compute-budget-interface = "3.0.0"

anyhow = "1.0.102"
async-trait = "0.1"
base64 = "0.22.1"
bincode = "1.3.3"
bytes = "1.7"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
rmp-serde = "1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
tracing = "0.1"
urlencoding = "2.1"

jupiter-swap-api-client = { git = "https://github.com/IliaZyrin/jupiter-swap-api-client", rev = "fc3574e4f77c065b9a2cf9c4032972ce6e944f3e" }
