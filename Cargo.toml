[package]
name = "solana-dex-superagg"
version = "1.0.0"
edition = "2021"
description = "A Rust library for accessing Titan and Jupiter DEX aggregators on Solana with smart routing strategies"
license = "MIT"
repository = "https://github.com/0dotxyz/solana-dex-superagg"
readme = "README.md"
keywords = ["solana", "dex", "swap", "jupiter", "titan", "aggregator", "defi"]
categories = ["cryptography::cryptocurrencies", "web-programming"]
authors = ["Abdul Rabbani"]

[lib]
name = "solana_dex_superagg"
path = "src/lib.rs"

[dependencies]
solana-sdk = "=3.0.0"
solana-program = "=3.0.0"
solana-client = "=3.1.11"
solana-commitment-config = "3.1.1"
spl-associated-token-account = { version = "8.0.0", default-features = false, features = ["no-entrypoint"] }
spl-token = "9.0.0"

anyhow = "1.0.102"
async-trait = "0.1"
base64 = "0.22.1"
bincode = "1.3.3"
bs58 = "0.5"
bytes = "1.7"
dotenvy = "0.15.0"
figment = { version = "0.10", features = ["env", "test"] }
fixed = "=1.28.0"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
rmp-serde = "1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2.1"

jupiter-swap-api-client = { git = "https://github.com/IliaZyrin/jupiter-swap-api-client", rev = "48c811655963daf3a5bb0905a421386bbedc6f61" }
